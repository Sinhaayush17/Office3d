<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A designer's day</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent}
  #oh{position:relative;width:100%;height:100vh;min-height:240px;overflow:hidden;touch-action:pan-y;
      -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #oh canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;outline:none}
  #ui{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
  .lb,.pp,.ht{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
  .lb{display:flex;align-items:center;gap:.5em;padding:.42em .85em;border-radius:99px;background:rgba(255,255,255,.92);color:#2B2F3A;
      font-weight:600;font-size:13px;box-shadow:0 4px 14px rgba(60,40,20,.14);opacity:.78;transition:opacity .3s,background .3s,color .3s}
  .lb i{width:.62em;height:.62em;border-radius:50%;display:block}
  .lb b{font-weight:500;opacity:.55;font-size:.86em}
  .lb.on{opacity:1;background:#2B2F3A;color:#fff}
  .pp{padding:.38em .8em;border-radius:99px;color:#fff;font-weight:700;font-size:13px;box-shadow:0 6px 16px rgba(40,30,20,.22)}
  .ht{width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-sizing:border-box;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .ht:after{content:"";position:absolute;left:-2px;top:-2px;right:-2px;bottom:-2px;border-radius:50%;border:2px solid currentColor;animation:pl 1.6s ease-out infinite}
  @keyframes pl{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
  #tl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:99px;
      background:rgba(255,255,255,.9);box-shadow:0 4px 16px rgba(60,40,20,.14);font-size:13px;color:#2B2F3A;pointer-events:auto}
  #tl .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:4.6em}
  #tl .n{font-weight:500;opacity:.7;min-width:6.4em}
  #tl .d{display:flex;gap:7px}
  #tl .d span{width:9px;height:9px;border-radius:50%;background:#D8D2C6;cursor:pointer;transition:transform .25s,background .25s}
  #tl .d span.on{transform:scale(1.45)}
  #eg{position:absolute;right:14px;bottom:14px;padding:7px 12px;border-radius:99px;background:#2B2F3A;color:#fff;font-size:12px;font-weight:600;opacity:0;transition:opacity .4s}
  @media (max-width:640px){.ht{width:8px;height:8px;margin:-4px 0 0 -4px;border-width:1.5px}.lb{font-size:11px}.lb b{display:none}.pp{font-size:11px}#tl{font-size:11px;gap:8px;padding:6px 10px;bottom:8px}#tl .n{display:none}#eg{bottom:46px;right:8px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head>
<body>
<div id="oh">
  <canvas aria-label="A 3D office. A designer walks through his day, room by room. Click a room to send him there."></canvas>
  <div id="ui"><div id="tl"><span class="t"></span><span class="n"></span><div class="d"></div></div><div id="eg"></div></div>
</div>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ================== SETTINGS YOU CAN TWEAK ================== */
const CFG={
  bg:'#F6F1E7',        // section background. Use 'transparent' to let the Framer background show through
  walkSpeed:1.75,      // metres per second
  dwell:6.5,           // seconds in each room
  focusDwell:12,       // seconds in Deep focus (the payoff)
  showTimeline:true,   // day timeline pill at the bottom
  showLabels:true,     // room name pills
  hello:"Hi, I'm Ayush" // shown when someone clicks the main character
};
/* ============================================================ */

const root=document.getElementById('oh'),canvas=root.querySelector('canvas'),ui=document.getElementById('ui');
root.style.background=CFG.bg;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let _s=11;const rnd=()=>{_s=(_s*16807)%2147483647;return _s/2147483647;};
const PI=Math.PI,RW=8,RD=5.2,HS=2.5,HG=2.2,DX=6.4;
const INK='#2B2F3A',WOOD='#C99664',CREAM='#F4EFE6';

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});}
catch(e){root.innerHTML='';throw e;}
const mobile=matchMedia('(pointer:coarse)').matches;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NeutralToneMapping||THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.setClearColor(0,0);
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.34;
const camera=new THREE.PerspectiveCamera(22,1,5,400);
const hemi=new THREE.HemisphereLight(0xffffff,0xd9c4aa,.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.castShadow=true;
sun.shadow.mapSize.set(mobile?1024:2048,mobile?1024:2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;sun.shadow.radius=5;
scene.add(sun,sun.target);

/* ---------- materials / geometry helpers ---------- */
const mats=new Map();
function M(c,o){const k=c+(o?JSON.stringify(o):'');let m=mats.get(k);if(!m){m=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.82,metalness:0},o));mats.set(k,m);}return m;}
const GLASS=new THREE.MeshStandardMaterial({color:0xa6d6e6,transparent:true,opacity:.17,roughness:.06,metalness:.1,depthWrite:false,side:THREE.DoubleSide});
const GLASS2=new THREE.MeshStandardMaterial({color:0x8fcbe0,transparent:true,opacity:.34,roughness:.06,metalness:.1,depthWrite:false,side:THREE.DoubleSide});
const G={box:new THREE.BoxGeometry(1,1,1),cyl:new THREE.CylinderGeometry(1,1,1,24),sph:new THREE.SphereGeometry(1,20,14),
  pot:new THREE.CylinderGeometry(1,.72,1,18),cone:new THREE.CylinderGeometry(.55,1,1,20),plane:new THREE.PlaneGeometry(1,1),
  cap:new THREE.SphereGeometry(1,20,10,0,PI*2,0,1.5),beard:new THREE.SphereGeometry(1,18,8,.1,PI-.2,2.02,1.12),
  smile:new THREE.TorusGeometry(.04,.009,6,12,PI),ico:new THREE.IcosahedronGeometry(1,1),tor:new THREE.TorusGeometry(1,.09,8,24,PI)};
function add(p,geo,mat,x,y,z,sx,sy,sz,sh){const m=new THREE.Mesh(geo,typeof mat==='string'?M(mat):mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=sh!==false;m.receiveShadow=sh!==false;p.add(m);return m;}
const bx=(p,x,y,z,w,h,d,c,sh)=>add(p,G.box,c,x,y+h/2,z,w,h,d,sh);
const cyl=(p,x,y,z,r,h,c,sh)=>add(p,G.cyl,c,x,y+h/2,z,r,h,r,sh);
const sph=(p,x,y,z,r,c,sh)=>add(p,G.sph,c,x,y,z,r,r,r,sh);
const rbs=new Map();
function rb(p,x,y,z,w,h,d,c,rad){rad=Math.min(rad||.05,w/2-.001,h/2-.001,d/2-.001);const k=[w,h,d,rad].join('|');let g=rbs.get(k);if(!g){g=new RoundedBoxGeometry(w,h,d,3,rad);rbs.set(k,g);}return add(p,g,c,x,y+h/2,z,1,1,1);}
function grp(p,x,y,z,ry){const g=new THREE.Group();g.position.set(x||0,y||0,z||0);if(ry)g.rotation.y=ry;p.add(g);return g;}
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}
const TEX={
  wood:ctex(256,256,(c,w)=>{for(let r=0;r<8;r++){let x=-rnd()*120;while(x<w){const L=90+rnd()*120;c.fillStyle='hsl(30,'+(34+rnd()*10)+'%,'+(74+rnd()*8)+'%)';c.fillRect(x,r*32,L,32);c.fillStyle='rgba(90,55,25,.22)';c.fillRect(x,r*32,1.5,32);x+=L;}c.fillStyle='rgba(90,55,25,.2)';c.fillRect(0,r*32,w,1.5);}}),
  tile:ctex(128,128,(c)=>{c.fillStyle='#F3EADB';c.fillRect(0,0,128,128);c.fillStyle='#E2D3BC';c.fillRect(0,0,64,64);c.fillRect(64,64,64,64);c.strokeStyle='rgba(120,90,60,.18)';c.lineWidth=2;c.strokeRect(0,0,64,64);c.strokeRect(64,64,64,64);c.strokeRect(64,0,64,64);c.strokeRect(0,64,64,64);}),
  carpet:ctex(128,128,(c)=>{c.fillStyle='#fff';c.fillRect(0,0,128,128);for(let i=0;i<1500;i++){c.fillStyle='rgba(0,0,0,'+rnd()*.07+')';c.fillRect(rnd()*128,rnd()*128,2,2);}c.strokeStyle='rgba(0,0,0,.06)';c.lineWidth=2;c.strokeRect(0,0,128,128);}),
  plaza:ctex(256,256,(c)=>{c.fillStyle='#EFE7D9';c.fillRect(0,0,256,256);const C=['#DDCFB9','#D2C1A6','#E6D8C2','#C5B299'];for(let i=0;i<260;i++){c.fillStyle=C[i%4];c.beginPath();c.ellipse(rnd()*256,rnd()*256,1+rnd()*2.6,1+rnd()*1.8,rnd()*3,0,7);c.fill();}c.strokeStyle='rgba(120,95,60,.16)';c.lineWidth=2;c.strokeRect(0,0,256,256);}),
  plaid:ctex(128,128,(c)=>{c.fillStyle='#E9DEC9';c.fillRect(0,0,128,128);const band=(v,p,w)=>{const g=v?c.createLinearGradient(p,0,p+w,0):c.createLinearGradient(0,p,0,p+w);g.addColorStop(0,'rgba(60,44,38,0)');g.addColorStop(.28,'rgba(34,26,25,.66)');g.addColorStop(.72,'rgba(34,26,25,.66)');g.addColorStop(1,'rgba(60,44,38,0)');c.fillStyle=g;v?c.fillRect(p,0,w,128):c.fillRect(0,p,128,w);};
    for(const p of[6,70]){band(1,p,40);band(0,p,40);}c.fillStyle='rgba(150,110,80,.14)';c.fillRect(0,0,128,128);})
};
const fmats=new Map();
function fmat(kind,rx,ry,tint){const k=[kind,rx,ry,tint].join();let m=fmats.get(k);if(!m){const t=TEX[kind].clone();t.repeat.set(rx,ry);t.needsUpdate=true;m=new THREE.MeshStandardMaterial({map:t,color:tint||'#ffffff',roughness:.88});fmats.set(k,m);}return m;}
const PLAID=fmat('plaid',2,2.4),PLAIDA=fmat('plaid',2,1.4);
function mkScreen(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return{c,x:c.getContext('2d'),t,w,h,mat:new THREE.MeshBasicMaterial({map:t,toneMapped:false})};}
const SCR={tv:mkScreen(384,216),monA:mkScreen(384,216),monB:mkScreen(384,216),board:mkScreen(512,256)};
SCR.board.mat=new THREE.MeshStandardMaterial({map:SCR.board.t,roughness:.35});
function sprite(txt,col){const t=ctex(64,64,(c)=>{c.font='700 50px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;c.fillText(txt,32,34);});const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.setScalar(0);return s;}

/* ---------- world state ---------- */
const W={g:null,rooms:[],nodes:[],ring:[],people:[],plants:[],clicks:[],picks:[],ticks:[],labels:[],hots:[],walkers:[],bounds:null,mode:'',P:0};
let T=0,vw=1,vh=1;
const pops=[];
function clk(o,fn){o.userData.click=fn;o.userData.bs=o.scale.x;W.clicks.push(o);return o;}

/* ---------- furniture ---------- */
function plant(p,x,z,s,type,pot){const g=grp(p,x,0,z);s=s||1;const pc=pot||CREAM;
  add(g,G.pot,pc,0,.2*s,0,.2*s,.4*s,.2*s);cyl(g,0,.39*s,0,.18*s,.02,'#5B4636');
  const top=grp(g,0,.4*s,0);
  if(type==='tree'){cyl(top,0,0,0,.035*s,.8*s,'#7A5A3C');const C=['#4F8E5E','#3C7350','#5FA06E'];
    [[0,1.02,0,.34],[.2,.82,.1,.24],[-.2,.86,-.08,.25],[.03,.72,-.2,.2],[-.06,1.25,.06,.2]].forEach((b,i)=>add(top,G.ico,M(C[i%3],{flatShading:true}),b[0]*s,b[1]*s,b[2]*s,b[3]*s,b[3]*s,b[3]*s));}
  else{const n=9;for(let i=0;i<n;i++){const lg=grp(top,0,0,0,i*PI*2/n+rnd());const tilt=.35+rnd()*.5,len=(.36+rnd()*.22)*s;const l=add(lg,G.sph,i%2?'#4F8E5E':'#3C7350',0,Math.cos(tilt)*len*.5,Math.sin(tilt)*len*.5,.085*s,len*.5,.022*s);l.rotation.x=tilt;}
    for(let i=0;i<3;i++){const l=add(top,G.sph,'#5FA06E',(i-1)*.05*s,.28*s,0,.07*s,.3*s,.02*s);l.rotation.z=(i-1)*.25;l.rotation.y=i;}}
  g.userData.top=top;g.userData.seed=rnd()*9;g.userData.w=0;W.plants.push(g);
  clk(g,()=>{g.userData.w=T;egg('plant','Watered',[g.getWorldPosition(new THREE.Vector3()).x,1.4*s,g.getWorldPosition(new THREE.Vector3()).z],'#3C8A5A');});return g;}
function chair(p,x,z,ry,col){const g=grp(p,x,0,z,ry);col=col||'#3A4150';cyl(g,0,0,0,.27,.04,'#22252D');cyl(g,0,0,0,.035,.42,'#22252D');rb(g,0,.42,0,.48,.08,.46,col,.035);rb(g,0,.56,-.23,.44,.5,.07,col,.03);return g;}
function stool(p,x,z,h,col){cyl(p,x,0,z,.03,h,'#22252D');cyl(p,x,0,z,.2,.03,'#22252D');cyl(p,x,h,z,.19,.06,col||WOOD);}
function laptop(p,x,y,z,ry,col){const g=grp(p,x,y,z,ry);rb(g,0,0,0,.34,.018,.24,col||'#B9C0CA',.008);const s=grp(g,0,.015,-.12);s.rotation.x=-.3;rb(s,0,0,0,.34,.23,.014,col||'#B9C0CA',.006);
  add(s,G.plane,new THREE.MeshBasicMaterial({color:0xdfe9ff}),0,.115,.008,.31,.2,1,false);return g;}
function mug(p,x,y,z,c){cyl(p,x,y,z,.04,.085,c||'#ffffff');return p;}
function books(p,x,y,z,len,alongX,seed){const C=['#E07A4F','#4C6FD8','#F2B544','#6FAF8A','#34425A','#E88FA8','#F3F1EC'];let a=0,i=seed||0;while(a<len-.05){const t=.045+((i*7)%5)*.012,h=.2+((i*5)%4)*.03;alongX?bx(p,x+a+t/2,y,z,t,h,.16,C[i%7]):bx(p,x,y,z+a+t/2,.16,h,t,C[i%7]);a+=t+.006;i++;}}
function frame(p,x,y,z,w,h,c1,c2){bx(p,x,y,z,w,h,.03,'#ffffff');bx(p,x,y+.05,z+.012,w-.1,h-.1,.012,c1);if(c2)cyl(p,x,y+h*.42,z+.02,Math.min(w,h)*.2,.01,c2).rotation.x=PI/2;}

/* ---------- people ---------- */
const HERO={skin:'#C08A63',hair:'curly',hc:'#131115',beard:1,shirtM:PLAID,armM:PLAIDA,pants:'#17171B',wide:1,long:1,shoe:'#F3F0EA',s:1.3};
const LOOKS=[
 {skin:'#D9A47E',hair:'long',hc:'#2A1D18',shirt:'#F3F1EC',pants:'#34425A',shoe:'#ffffff'},
 {skin:'#B97F5C',hair:'short',hc:'#121014',shirt:'#5C6470',pants:'#23262E',shoe:'#E9E4DA'},
 {skin:'#E3B58F',hair:'bun',hc:'#3A2620',shirt:'#E2A73E',pants:'#3B3F4A',shoe:'#ffffff'},
 {skin:'#A9714F',hair:'short',hc:'#17131A',shirt:'#7FA07A',pants:'#2E3440',shoe:'#F0EDE6'},
 {skin:'#D6A37C',hair:'long',hc:'#1E1716',shirt:'#D9764E',pants:'#2B3550',shoe:'#ffffff'},
 {skin:'#C99470',hair:'short',hc:'#221A18',shirt:'#F3F1EC',pants:'#4A5568',shoe:'#ffffff'},
 {skin:'#E0AE88',hair:'bun',hc:'#4A3128',shirt:'#6F8FCB',pants:'#252830',shoe:'#ffffff'},
 {skin:'#B5805D',hair:'long',hc:'#15121A',shirt:'#B9A2E8',pants:'#2E3440',shoe:'#F0EDE6'},
 {skin:'#D2A07A',hair:'short',hc:'#5A3B28',shirt:'#3F8F86',pants:'#33384A',shoe:'#ffffff'}];
function mkPerson(L){
  const rootG=new THREE.Group(),hips=grp(rootG,0,.82,0),torso=grp(hips,0,0,0),s=L.s||1.16;rootG.scale.setScalar(s);
  const tm=L.shirtM||M(L.shirt),am=L.armM||tm,y0=L.long?-.16:-.06;
  rb(torso,0,y0,0,.47,.6-y0,.27,tm,.1);
  cyl(torso,0,.56,0,.07,.1,L.skin);
  if(L.long){const c1=bx(torso,-.07,.565,.11,.13,.035,.07,'#EFE6D2');c1.rotation.z=.5;const c2=bx(torso,.07,.565,.11,.13,.035,.07,'#EFE6D2');c2.rotation.z=-.5;for(let i=0;i<4;i++)sph(torso,0,.42-i*.13,.137,.012,'#F6F2EA',false);}
  const head=grp(torso,0,.82,0);sph(head,0,0,0,.215,L.skin);sph(head,.212,-.01,0,.04,L.skin);sph(head,-.212,-.01,0,.04,L.skin);
  const dk=M('#1b1a1f',{roughness:.4});
  for(const sx of[-1,1]){const e=add(head,G.sph,dk,sx*.078,.012,.196,.026,.03,.02,false);if(L.beard){const b=bx(head,sx*.08,.068,.2,.07,.014,.015,L.hc,false);b.rotation.z=-sx*.12;}}
  sph(head,0,-.03,.215,.026,L.skin,false);
  const sm=add(head,G.smile,dk,0,-.075,.198,1,1,1,false);sm.rotation.z=PI;
  if(L.beard){add(head,G.beard,M('#3A2B25',{roughness:1}),0,-.004,.004,.221,.223,.221,false);bx(head,0,-.058,.213,.1,.018,.016,'#3A2B25',false);sm.position.set(0,-.085,.214);sm.scale.setScalar(.8);sm.material=M('#8A5A48');}
  const hm=M(L.hc,{roughness:.95});
  if(L.hair==='curly'){let q=5;const r=()=>{q=(q*16807)%2147483647;return q/2147483647;};
    for(let i=0;i<64;i++){const u=r(),v=r(),th=u*PI*2,y=-.12+v*1.12,rr=Math.sqrt(Math.max(0,1-y*y)),dx=Math.cos(th)*rr,dz=Math.sin(th)*rr;
      if(dz>.48&&y<.62)continue;if(y<.1&&Math.abs(dx)>.75)continue;const top=y>.45;sph(head,dx*.2,y*.2+(top?.04:0),dz*.2-(top?0:.01),top?.075+r()*.03:.05+r()*.02,hm,false);}
    for(let i=0;i<7;i++)sph(head,-.12+i*.04,.19+Math.sin(i*1.3)*.012,.13,.058,hm,false);}
  else{const c=add(head,G.cap,hm,0,.012,-.012,.227,.232,.23,false);c.rotation.x=-.32;
    if(L.hair==='long')rb(head,0,-.3,-.1,.42,.42,.2,hm,.09);if(L.hair==='bun')sph(head,0,.2,-.14,.095,hm);}
  const arm=sx=>{const sh=grp(torso,sx*.28,.5,0);sph(sh,0,0,0,.078,am,false);cyl(sh,0,-.27,0,.068,.27,am);const el=grp(sh,0,-.27,0);sph(el,0,0,0,.066,am,false);cyl(el,0,-.25,0,.062,.25,am);const hand=grp(el,0,-.29,0);sph(hand,0,0,0,.062,L.skin);return{sh,el,hand};};
  const leg=sx=>{const r1=L.wide?.118:.095,r2=L.wide?.122:.085,hp=grp(hips,sx*.118,0,0);cyl(hp,0,-.4,0,r1,.42,L.pants);const kn=grp(hp,0,-.4,0);sph(kn,0,0,0,r1,L.pants,false);cyl(kn,0,-.37,0,r2,.37,L.pants);rb(kn,0,-.42,.05,.14,.09,.27,L.shoe,.04);return{hp,kn};};
  const c={root:rootG,hips,torso,head,aL:arm(1),aR:arm(-1),lL:leg(1),lR:leg(-1),L,pose:'stand',sit:0,seatH:.5,ph:rnd()*6,seed:rnd()*20,waveT:0,lookY:0,lookX:0,carry:false,bs:s};
  rootG.userData.bs=s;W.people.push(c);return c;}
function animPerson(c,dt,t){

        hero.idleUntil=T+(hero.cur===5?CFG.focusDwell:CFG.dwell+(hero.manual?2:0));hero.manual=false;trig(N);}}

let last=0,running=true,raf=0,fN=0,fT=0,ql=0,prCap=mobile?1.75:2;
function loop(now){raf=0;if(!running)return;const rdt=(now-last)/1000||0,dt=clamp(rdt,0,.05);last=now;sim(dt);
  if(T>5&&ql<2&&rdt<.5){fN++;fT+=rdt;if(fN>=70){if(fN/fT<34){ql++;prCap=ql===1?1:.75;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,prCap));renderer.setSize(vw,vh,false);}fN=fT=0;}}
  renderer.render(scene,camera);overlay();raf=requestAnimationFrame(loop);}
function sim(dt){T+=dt;
  updateHero(dt);updateWalkers(dt);for(const R of W.rooms){R.tick&&R.tick(dt);if(T<3.2){const k=clamp((T-.15-R.i*.13)/.75,0,1),e=1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2);R.g.scale.y=Math.max(.001,k<=0?0:e);}else if(R.g.scale.y!==1)R.g.scale.y=1;}
  for(const c of W.people)animPerson(c,dt,T);
  for(const p of W.plants){const w=T-p.userData.w,k=w<1.2?Math.sin(w*18)*.22*(1-w/1.2):0;p.userData.top.rotation.z=Math.sin(T*1.1+p.userData.seed)*.035+k;p.userData.top.rotation.x=Math.cos(T*.9+p.userData.seed)*.03;}
  for(const o of W.clicks){const tg=o.userData.bs*(o===hovO?1.07:1);if(Math.abs(o.scale.x-tg)>.001)o.scale.setScalar(o.scale.x+(tg-o.scale.x)*.2);}
  tickConfetti(dt);updateSun(dt);
  const sway=ptr.on?0:1;cam.px+=((ptr.on?ptr.x:Math.sin(T*.25)*.45*sway)-cam.px)*.05;cam.py+=((ptr.on?ptr.y:Math.sin(T*.19)*.3*sway)-cam.py)*.05;
  cam.yawNow=cam.yaw+cam.px*.085;camPlace(cam.yawNow,cam.pitch-cam.py*.04);
}
function overlay(){
  for(const l of W.labels){const s=scr(...l.p),on=(l.R.i===hero.target)||hov===l.R;l.el.style.transform='translate('+s[0].toFixed(1)+'px,'+s[1].toFixed(1)+'px) translate(-50%,-50%)';if(l.on!==on){l.on=on;l.el.classList.toggle('on',on);}}
  for(const h of W.hots){const s=scr(...h.p);h.el.style.transform='translate('+s[0].toFixed(1)+'px,'+s[1].toFixed(1)+'px)';}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i],k=(T-p.t)/2.3;if(k>=1){p.el.remove();pops.splice(i,1);continue;}const s=scr(...p.p),a=k<.1?k/.1:k>.72?(1-k)/.28:1,sc=k<.12?.6+k/.12*.4:1;
    p.el.style.opacity=a;p.el.style.transform='translate('+s[0].toFixed(1)+'px,'+(s[1]-ease(Math.min(1,k*1.5))*34).toFixed(1)+'px) translate(-50%,-50%) scale('+sc.toFixed(3)+')';}
}
function start(){if(!raf&&running){last=performance.now();raf=requestAnimationFrame(loop);}}
let rsT=0;
function resize(force){const cw=root.clientWidth,ch=root.clientHeight;if(!cw||!ch)return;vw=cw;vh=ch;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,prCap));renderer.setSize(cw,ch,false);
  const asp=cw/ch,L=layout(asp);if(force||L.mode!==W.mode||Math.abs(L.P-W.P)>.25)buildWorld(asp);else fit();}
new ResizeObserver(()=>{clearTimeout(rsT);rsT=setTimeout(()=>resize(false),120);}).observe(root);
new IntersectionObserver(en=>{running=en[0].isIntersecting&&!document.hidden;start();}).observe(root);
document.addEventListener('visibilitychange',()=>{running=!document.hidden;start();});
resize(true);start();
</script>
